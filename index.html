<!DOCTYPE html>
<!-- This tells the browser that we are using the modern HTML5 standard -->
<html lang="en">
<head>
    <!-- Sets the character encoding to support standard text characters -->
    <meta charset="UTF-8">
    <!-- Ensures the website looks good and scales correctly on mobile phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The title displayed on the browser tab -->
    <title>Nearby Temples Directory</title>
    <!-- Links this HTML file to your style.css file for colors and layouts -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header banner section at the top of the webpage -->
    <header>
        <h1>Explore Nearby Temples</h1>
        <p>Click on any temple to view its history and map location</p>
    </header>

    <!-- Main container that holds all the core content of the page -->
    <main class="container">
        
        <!-- SECTION 1: THE TEMPLE GRID DISPLAY -->
        <!-- This container holds all individual temple cards in a grid layout -->
        <section class="temple-grid">
            
            <!-- Card for Temple 1. The 'onclick' attribute triggers the JavaScript function when clicked -->
            <div class="temple-card" onclick="showDetails('temple1')">
                <img src="temple1.jpeg" alt="Temple One Image">
                <h3>Parleshwar mandir</h3>
            </div>
            
            <!-- Card for Temple 2. It passes 'temple2' to the JavaScript function when clicked -->
            <div class="temple-card" onclick="showDetails('temple2')">
                <img src="temple2.jpeg" alt="Temple Two Image">
                <h3>Pimpleshwar mandir</h3>
            </div>

            <!-- Card for Temple 3. It passes 'temple3' to the JavaScript function when clicked -->
            <div class="temple-card" onclick="showDetails('temple3')">
                <img src="temple3.jpeg" alt="Temple Three Image">
                <h3>Saibaba mandir</h3>
            </div>
          <div class="temple-card"onclick="showDetais('temple4')">
<img src="temple4.jpeg" alt="Temple 4 image">
<h3>Madrasi Ram mandir</h3>
</div>
        </section>

        <!-- SECTION 2: DYNAMIC DETAILS PANEL -->
        <!-- This section starts with the class 'hidden' so it remains invisible until a user clicks a card -->
        <section id="details-section" class="details-box hidden">
            <!-- JavaScript will dynamically change the text inside this Heading tag -->
            <h2 id="dynamic-title">Temple Name</h2>
            <!-- JavaScript will dynamically insert the history paragraph text here -->
            <p id="dynamic-history">Temple history will appear here.</p>
            
            <h3>Location Map</h3>
            <!-- JavaScript will drop the Google Map iframe code right inside this div wrapper -->
            <div id="dynamic-map" class="map-container"></div>
        </section>
        
    </main>

    <!-- SECTION 3: JAVASCRIPT LOGIC -->
    <script>
        // This object acts like a small database storing all information for each temple
        const templeData = {
            // Data block for temple1
            temple1: {
                title: "Parleshwar Mandir",
                history: "The temple features a sprawling, clean courtyard and is divided into multi-deity sections:Lord Shiva: The main shrine houses a Swayambhu (self-manifested) Shiva Linga, accompanied by an idol of Goddess Uma (Parvati) right behind it.Lord Ganesha: A primary attraction within the complex, featuring a large, beautiful alloy-based Ganesha idol that captures great devotion from locals.
                The temple remains open every day of the week, following a split schedule that closes the doors for a midday break:
Morning Darshan: 5:30 AM to 12:00 PM
Evening Darshan: 3:30 PM to 10:00 PM
Evening Aarti: Main prayer takes place daily at 7:30 PM.",
                // Google Maps iframe embedded code placed between backticks
                mapHtml: `<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3770.1095326829636!2d72.8444311752061!3d19.10285018210729!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7c9b5c8fa60e7%3A0x9850870b31d9853d!2sShri%20Parleshwar%20Temple!5e0!3m2!1sen!2sin!4v1779084212312!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>`
            },
            // Data block for temple2
            temple2: {
                title: "Pimpleshwar Mandir",
                history: ": The temple has served as a central community cornerstone for over 60 years. Alongside the primary deity Lord Shiva, it also houses a shrine for Lord Shanishwar (Shani Dev). Devotees highly revere it for its peaceful spiritual energy and powerful presence during standard rituals
                  Darshan timing:5:00 AM to 10:00 PM every day 
                 Morning Aarti: 6:30 AM to 7:00 AM"
                  Evening Aarti:7:00 PM to 7:30 PM,
                mapHtml: `<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3769.9616564546964!2d72.84613407520617!3d19.109337982102108!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7c9cb0a61693d%3A0xf369d468c581798a!2sShree%20Pimpleshwar%20Mahadev%20Mandir!5e0!3m2!1sen!2sin!4v1779084688802!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>`
            },
            // Data block for temple3
            temple3: {
                title: "Saibaba mandir",
                history: "It features a highly unique and beautiful sitting statue of Shri Sai Baba placed on an elevated platform in the open compound space. The statue was carved by the famous sculptor Shri Vasant Govekar.
                 Darshan timings:6:00 AM to 9:30 PM.",
                mapHtml: `<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3770.176181752334!2d72.84527607520593!3d19.099925382109532!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7c9b477391505%3A0x71954a9a55069fce!2sSaibaba%20Mandir!5e0!3m2!1sen!2sin!4v1779085039572!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>`
            }
temple4: {
title:"Madrasi Ram Mandir",
history:"Ramanjaneya Devasthan (popularly known as the Madrasi Ram Mandir) is a historic, deeply revered temple located right in the heart of Vile Parle East. Founded in 1935 by the great saint Shri Laxminarayan Maharaj, it is one of the oldest Saraswat temples in Mumbai and is proudly managed by members of the GSB (Gaud Saraswat Brahmin) community.
The complex features two main beautifully adorned shrines—one dedicated to Lord Rama (along with Mata Sita and Lakshman) and another dedicated to Lord Hanuman (Anjaneya). It also houses shrines for Lord Ganesha, Lord Shiva, and Ugra Narasimha.
.",
mapHtml:`<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3770.0356849451505!2d72.84832567520611!3d19.10609038210464!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7c9caac3d4e83%3A0xd4592b557ab75a09!2sRamanjaneya%20Devasthan(Ram%20Mandir)!5e0!3m2!1sen!2sin!4v1779085358536!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>`
}
        };

        // The core function that changes the content on the screen based on what was clicked
        function showDetails(templeKey) {
            // Fetches the specific temple block (title, history, map) from our database object above
            const data = templeData[templeKey];
            
            // Finds the title element by its ID and overwrites its text content with the temple's title
            document.getElementById('dynamic-title').innerText = data.title;
            
            // Finds the history element by its ID and overwrites its text content with the temple's history
            document.getElementById('dynamic-history').innerText = data.history;
            
            // Finds the map div container and injects the live Google Map iframe HTML code inside it
            document.getElementById('dynamic-map').innerHTML = data.mapHtml;
            
            // Removes the 'hidden' CSS styling so the hidden details panel instantly reveals itself on screen
            document.getElementById('details-section').classList.remove('hidden');
            
            // Instructs the browser to smoothly scroll down to display the freshly revealed details box
            document.getElementById('details-section').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
